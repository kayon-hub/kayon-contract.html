<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KAYON STUDIO｜LINE 帳號綁定</title>
<!-- ... (樣式與 HTML 結構保留) ... -->
</head>
<body>
<!-- ... -->
<script>
const LIFF_ID = '2010027736-kgBDDUmh';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzpMIhdFGQZ23pBroz01mR7F-rJb3LguJsULP9Z3NDw0sWDVcqA_GalRsgMlhz1--Xs/exec';

async function checkAlreadyBound(uid) {
  try {
    const res = await fetch(GAS_URL + '?action=checkBind&uid=' + encodeURIComponent(uid));
    const data = await res.json();
    if (data.bound) {
      document.getElementById('mainContent').style.display = 'none';
      const bs = document.getElementById('boundScreen');
      bs.style.display = 'flex';
      document.getElementById('boundInfo').textContent =
        `${data.name}，您的 LINE 帳號已綁定（${data.email}）。\n付款完成後系統將自動通知您。`;
    }
  } catch (err) {
    console.error('Check bind failed:', err);
  }
}

async function submitBind() {
  const btn = document.getElementById('bindBtn');
  const name = document.getElementById('bindName').value.trim();
  const email = document.getElementById('bindEmail').value.trim();
  const phone = document.getElementById('bindPhone').value.trim();

  if (!name || !email || !phone) {
    alert('請填寫所有必填欄位');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '綁定中...';

  const bindData = {
    action: 'bind',
    uid: liffProfile?.userId || 'unknown',
    lineDisplayName: liffProfile?.displayName || '—',
    linePicture: liffProfile?.pictureUrl || '',
    name, email, phone,
    bindTime: new Date().toLocaleString('zh-TW')
  };

  try {
    const response = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(bindData)
    });

    const result = await response.json();
    if (result.success) {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('successScreen').style.display = 'flex';
    } else {
      throw new Error(result.message || '綁定失敗');
    }
  } catch (err) {
    alert('系統錯誤：' + err.message);
    btn.disabled = false;
    btn.innerHTML = '完成身份綁定 →';
  }
}
</script>
</body>
</html>
