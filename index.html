<script>
/* ─── 設定區 ─── */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzpMIhdFGQZ23pBroz01mR7F-rJb3LguJsULP9Z3NDw0sWDVcqA_GalRsgMlhz1--Xs/exec';

/* ─── 核心提交邏輯 ─── */
async function submitContract() {
  const btn = document.querySelector('.btn-primary');
  const originalText = btn.innerHTML;
  
  try {
    btn.disabled = true;
    btn.innerHTML = '簽署提交中...';

    const name = document.getElementById('studentName').value;
    const phone = document.getElementById('studentPhone').value;
    const email = document.getElementById('studentEmail').value;
    const course = document.getElementById('courseType').value;
    const no = document.getElementById('contractNo').textContent;
    
    const payload = {
      action: 'contract',
      contractNo: no,
      name: name,
      phone: phone,
      email: email,
      course: course,
      // 法代資訊 (若有)
      guardianName: document.getElementById('guardianName')?.value || '',
      guardianRel: document.getElementById('guardianRel')?.value || '',
      guardianPhone: document.getElementById('guardianPhone')?.value || '',
      guardianEmail: document.getElementById('guardianEmail')?.value || '',
      guardianIdUploaded: (guardianFiles.id.length > 0),
      // 簽名資料
      studentSignature: sigCanvases.student.toDataURL(),
      guardianSignature: sigCanvases.guardian ? sigCanvases.guardian.toDataURL() : '',
      timestamp: new Date().toLocaleString('zh-TW')
    };

    const response = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.success) {
      // 顯示成功畫面
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('successScreen').style.display = 'flex';
      document.getElementById('sNo').textContent = no;
      document.getElementById('sName').textContent = name;
      document.getElementById('sCourse').textContent = course;
      document.getElementById('sTime').textContent = payload.timestamp;
    } else {
      throw new Error(result.error || '提交失敗');
    }

  } catch (err) {
    console.error('Submit failed:', err);
    alert('提交失敗：' + err.message + '\n請檢查網路連線或聯繫管理員。');
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

/* ─── PDF 匯出 ─── */
async function exportPDF() {
  const element = document.getElementById('contractPreview'); // 假設有一個預覽區塊
  if (!element) {
    alert('正在準備 PDF 匯出功能...');
    return;
  }
  const canvas = await html2canvas(element);
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();
  pdf.addImage(imgData, 'PNG', 0, 0);
  pdf.save(`KAYON_Contract_${document.getElementById('studentName').value}.pdf`);
}
