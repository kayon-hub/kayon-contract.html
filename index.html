<main id="mainContent" class="content">

  <!-- HERO SECTION -->
  <div class="hero-wrap">

    <img src="/hero.webp"
         alt="KAYON STUDIO HERO"
         class="hero-image">

    <div class="cta-wrap">
      <a href="https://www.pro360.com.tw/shop/item/41205?return_url=%2Fdashboard%2Fshop%2Fproduct%2Fedit%2F652978%2F876%2F41205%3Fback_url%3Dhttps%253A%252F%252Fwww.pro360.com.tw%252Fdashboard%252Fshop%253Fservice_id%253D652978"
         target="_blank"
         class="cta-btn">

         立即預約課程

      </a>
    </div>

  </div>

  <div id="page1" class="page active">

    <div class="info-card">
      <div class="info-row">
        <span class="info-key">合約編號</span>
        <span id="contractNo"
              class="info-val"
              style="color:var(--gold)">
              KY-20260511-001
        </span>
      </div>
    </div>

    <div class="field">
      <label class="field-label">
        學員姓名
        <span class="req">*</span>
      </label>

      <input type="text"
             id="studentName"
             placeholder="請輸入您的真實姓名">
    </div>

    <div class="field">
      <label class="field-label">
        聯絡電話
        <span class="req">*</span>
      </label>

      <input type="tel"
             id="studentPhone"
             placeholder="請輸入您的聯絡電話">
    </div>

    <div class="field">
      <label class="field-label">
        電子信箱
        <span class="req">*</span>
      </label>

      <input type="email"
             id="studentEmail"
             placeholder="請輸入您的電子信箱">
    </div>

    <div class="field">
      <label class="field-label">
        課程類型
        <span class="req">*</span>
      </label>

      <select id="courseType">

        <option value="聲音啟航計劃A 四堂課$4,200">
          聲音啟航計劃A 四堂課$4,200
        </option>

        <option value="聲音啟航計劃B 8+1堂課$8,000">
          聲音啟航計劃B 8+1堂課$8,000
        </option>

        <option value="創作啟航計劃A 四堂課$4,200">
          創作啟航計劃A 四堂課$4,200
        </option>

        <option value="創作啟航計劃B 8+1堂課$8,000">
          創作啟航計劃B 8+1堂課$8,000
        </option>

      </select>
    </div>

    <div class="field" style="margin-top:20px">

      <label class="field-label">
        學員簽名
        <span class="req">*</span>
      </label>

      <div class="canvas-wrap" id="wrap0">

        <canvas id="canvas0"></canvas>

        <div class="canvas-hint" id="hint0">
          在此簽名
        </div>

      </div>

      <button
        style="background:transparent;border:none;color:var(--text3);font-size:11px;margin-top:8px;cursor:pointer"
        onclick="clearCanvas()">

        清除重簽

      </button>

    </div>

    <button class="btn-primary"
            onclick="submitContract()">

            確認並提交簽署

    </button>

  </div>

  <div id="successScreen"
       class="page"
       style="display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:40px">

    <div style="font-size:48px;margin-bottom:20px;color:var(--gold)">
      ✓
    </div>

    <h3>簽署成功！</h3>

    <p style="color:var(--text2);margin-top:10px">
      您的合約已成功提交，我們將會寄送副本至您的信箱。
    </p>

    <div class="info-card"
         style="margin-top:30px;width:100%">

      <div class="info-row">
        <span class="info-key">學員姓名</span>
        <span id="sName" class="info-val"></span>
      </div>

      <div class="info-row">
        <span class="info-key">課程名稱</span>
        <span id="sCourse" class="info-val"></span>
      </div>

      <div class="info-row">
        <span class="info-key">簽署時間</span>
        <span id="sTime" class="info-val"></span>
      </div>

    </div>

  </div>

</main>
