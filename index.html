<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAYON STUDIO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
    }

    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;

      /* 新圖片 */
      background: url('./hero2.webp') center center / cover no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
      padding: 40px;
    }

    /* 黑色遮罩 */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 96px);
      letter-spacing: 4px;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .hero p {
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.8;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 16px 42px;

      border-radius: 999px;
      text-decoration: none;

      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;

      background: white;
      color: black;

      transition: 0.3s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* 手機版 */
    @media (max-width: 768px) {
      .hero {
        background-position: center center;
        padding: 24px;
      }

      .hero h1 {
        margin-bottom: 16px;
      }

      .hero p {
        margin-bottom: 32px;
      }

      .cta-button {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <div class="hero-content">
      <h1>KAYON STUDIO</h1>

      <p>
        SOUND NARRATIVE ｜ MUSIC PRODUCTION
      </p>

      <a
        class="cta-button"
        href="https://www.pro360.com.tw/shop/item/41205?return_url=%2Fdashboard%2Fshop"
        target="_blank"
      >
        BOOK NOW
      </a>
    </div>

  </section>

</body>
</html>
