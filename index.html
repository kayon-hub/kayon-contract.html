<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAYON STUDIO - DEFINE YOUR SOUND</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #000;
      color: white;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: url('./newplan.webp') center center / cover no-repeat;
    }

    /* 強化黑色透明玻璃感與金色邊框的 CTA */
    .cta-button {
      position: absolute;
      bottom: 5%;
      left: 5%; /* 移至左下角 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px 50px;
      background: rgba(0, 0, 0, 0.4); /* 調整透明度增加玻璃感 */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid #D4AF37; /* 使用更亮一點的金色 */
      border-radius: 4px; /* 圖片中看起來較為方正，稍微圓角即可 */
      text-decoration: none;
      color: #FFFFFF;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(212, 175, 55, 0.1);
      cursor: pointer;
      z-index: 10;
    }

    .cta-button:hover {
      background: rgba(0, 0, 0, 0.7);
      border-color: #F9E29C; /* 懸停時邊框更亮 */
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
      transform: scale(1.02);
    }

    .cta-title {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 4px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      color: #F0EDE6;
    }

    /* 金色播放小箭頭 */
    .cta-title::before {
      content: '';
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 12px solid #D4AF37;
      margin-right: 15px;
    }

    .cta-subtitle {
      font-size: 14px;
      letter-spacing: 3px;
      color: #F0EDE6;
      opacity: 0.8;
    }

    /* 響應式調整 */
    @media (max-width: 768px) {
      .container {
        background-position: center center;
      }
      .cta-button {
        padding: 10px 30px;
        bottom: 15%;
      }
      .cta-title {
        font-size: 18px;
        letter-spacing: 2px;
      }
      .cta-subtitle {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 串連 Pro360 網址的 CTA -->
    <a href="https://www.pro360.com.tw/shop/item/41524" class="cta-button" target="_blank">
      <div class="cta-title">DEFINE YOUR SOUND</div>
      <div class="cta-subtitle">你的聲音 值得被世界記住</div>
    </a>
  </div>

</body>
</html>
