<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAYON STUDIO - DEFINE YOUR SOUND</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #000;
      color: white;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: url('./plan.webp') center center / cover no-repeat;
    }

    /* 手機版背景圖調整 */
    @media (max-width: 768px) {
      .container {
        background-position: center center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
  </div>

</body>
</html>
