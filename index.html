<style>
/* ─── KAYON STUDIO PREMIUM BLACK GOLD UI ─── */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

:root{
  --gold:#C9A84C;
  --gold-light:#E8C96A;
  --gold-dim:#8B6E2E;
  --gold-glow:rgba(201,168,76,0.15);

  --bg:#0A0A0A;
  --bg2:#111111;
  --bg3:#181818;
  --bg4:#222222;

  --border:#252525;
  --border-gold:rgba(201,168,76,0.22);

  --text:#F0EDE6;
  --text2:#888;
  --text3:#444;

  --radius:18px;
  --radius-sm:12px;

  --transition:0.25s cubic-bezier(0.4,0,0.2,1);
}

html{
  scroll-behavior:smooth
}

body{
  background:
    radial-gradient(
      circle at top,
      #1A1A1A 0%,
      #0A0A0A 45%
    );

  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  font-size:14px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}

/* ─── APP CONTAINER ─── */

.app{
  max-width:430px;
  margin:24px auto;
  min-height:calc(100vh - 48px);

  display:flex;
  flex-direction:column;
  position:relative;

  background:
    linear-gradient(
      180deg,
      rgba(20,20,20,0.98),
      rgba(10,10,10,0.98)
    );

  border:1px solid rgba(201,168,76,0.22);

  border-radius:24px;
  overflow:hidden;

  box-shadow:
    0 0 0 1px rgba(201,168,76,0.08),
    0 12px 40px rgba(0,0,0,0.45),
    0 0 30px rgba(201,168,76,0.05);
}

/* ─── HEADER ─── */

.header{
  padding:18px 20px 14px;

  background:
    rgba(10,10,10,0.92);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  position:sticky;
  top:0;
  z-index:200;

  border-bottom:
    1px solid rgba(201,168,76,0.12);

  box-shadow:
    0 1px 0 rgba(201,168,76,0.05);
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-mark{
  width:34px;
  height:34px;

  background:
    linear-gradient(
      145deg,
      var(--gold-light),
      var(--gold)
    );

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:11px;
  font-weight:700;
  color:#000;

  letter-spacing:0.5px;

  flex-shrink:0;

  box-shadow:
    0 4px 12px rgba(201,168,76,0.28);
}

.logo-name{
  font-size:13px;
  font-weight:500;
  color:var(--text);
  letter-spacing:0.8px;
}

/* ─── STATUS BADGE ─── */

.status-pill{
  background:
    rgba(201,168,76,0.10);

  border:
    1px solid rgba(201,168,76,0.18);

  color:var(--gold);

  font-size:10px;

  padding:5px 12px;

  border-radius:20px;

  letter-spacing:0.7px;

  white-space:nowrap;

  transition:var(--transition);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.02);
}

/* ─── PROGRESS ─── */

.progress-wrap{
  padding:18px 20px 8px;
  background:var(--bg);
}

.steps{
  display:flex;
  align-items:center;
}

.step{
  display:flex;
  align-items:center;
  flex:1;
}

.step:last-child{
  flex:0;
}

.step-dot{
  width:28px;
  height:28px;

  border-radius:50%;

  border:
    1.5px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:10px;
  font-weight:500;

  color:var(--text3);

  background:var(--bg2);

  flex-shrink:0;

  transition:var(--transition);
}

.step-line{
  flex:1;
  height:1px;
  background:var(--border);
  transition:var(--transition);
}

.step.active .step-dot{
  border-color:var(--gold);
  color:var(--gold);

  background:
    rgba(201,168,76,0.08);

  box-shadow:
    0 0 12px rgba(201,168,76,0.08);
}

.step.done .step-dot{
  border-color:var(--gold);

  background:
    linear-gradient(
      145deg,
      var(--gold-light),
      var(--gold)
    );

  color:#000;
  font-weight:700;
}

.step.done .step-line,
.step.active .step-line{
  background:var(--gold-dim);
}

/* ─── CONTENT ─── */

.content{
  flex:1;
  padding:22px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.page{
  display:none;
  animation:fadeIn 0.3s ease;
}

.page.active{
  display:block;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(6px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

/* ─── INFO CARD ─── */

.info-card{
  background:
    linear-gradient(
      180deg,
      rgba(24,24,24,0.98),
      rgba(16,16,16,0.98)
    );

  border:
    1px solid rgba(201,168,76,0.14);

  border-radius:18px;

  padding:18px;

  margin-bottom:18px;

  position:relative;
  overflow:hidden;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.02),
    0 10px 30px rgba(0,0,0,0.22);
}

.info-card::before{
  content:'';

  position:absolute;
  top:0;
  left:0;
  right:0;

  height:2px;

  background:
    linear-gradient(
      90deg,
      var(--gold) 0%,
      transparent 100%
    );
}

.info-card::after{
  content:'';

  position:absolute;
  inset:0;

  border:
    1px solid rgba(201,168,76,0.06);

  border-radius:18px;

  pointer-events:none;
}

.info-row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:10px 0;

  border-bottom:
    1px solid rgba(255,255,255,0.03);
}

.info-row:last-child{
  border-bottom:none;
}

.info-key{
  font-size:12px;
  color:var(--text2);
}

.info-val{
  font-size:12px;
  color:var(--text);
  text-align:right;
}

/* ─── FORM ─── */

.field{
  margin-bottom:16px;
}

.field-label{
  font-size:11px;
  color:var(--text2);

  letter-spacing:0.7px;

  margin-bottom:8px;

  display:flex;
  align-items:center;
  gap:4px;

  text-transform:uppercase;
}

.req{
  color:var(--gold);
  font-size:10px;
}

.field input,
.field select{
  width:100%;

  background:
    rgba(24,24,24,0.95);

  border:
    1px solid rgba(255,255,255,0.04);

  border-radius:var(--radius-sm);

  padding:12px 14px;

  font-size:13px;

  color:var(--text);

  outline:none;

  transition:all var(--transition);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.02);
}

.field input:focus,
.field select:focus{
  border-color:var(--gold-dim);

  background:
    rgba(201,168,76,0.03);

  box-shadow:
    0 0 0 3px rgba(201,168,76,0.06);
}

/* ─── SIGNATURE ─── */

.canvas-wrap{
  background:
    linear-gradient(
      180deg,
      rgba(18,18,18,0.98),
      rgba(10,10,10,0.98)
    );

  border:
    1px dashed rgba(201,168,76,0.25);

  border-radius:16px;

  height:130px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:crosshair;

  position:relative;
  overflow:hidden;

  touch-action:none;
}

.canvas-wrap canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.canvas-hint{
  font-size:12px;
  color:var(--text3);
  pointer-events:none;
  user-select:none;
}

/* ─── BUTTON ─── */

.btn-primary{
  width:100%;

  background:
    linear-gradient(
      145deg,
      var(--gold-light),
      var(--gold)
    );

  color:#000;

  border:none;

  padding:15px;

  border-radius:14px;

  font-weight:700;
  font-size:14px;

  letter-spacing:0.5px;

  cursor:pointer;

  transition:var(--transition);

  margin-top:22px;

  box-shadow:
    0 6px 18px rgba(201,168,76,0.22);
}

.btn-primary:hover{
  transform:translateY(-1px);

  box-shadow:
    0 10px 24px rgba(201,168,76,0.28);
}

.btn-primary:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

/* ─── SUCCESS ─── */

#successScreen h3{
  font-size:24px;
  margin-top:6px;
}

#successScreen p{
  line-height:1.7;
}
</style>
